<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast by D²🌤</title>

  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script defer src="script.js"></script>
</head>
<body>

<div class="container">

  <!-- LEFT -->
  <div class="left">
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city 🌍">
      <select id="unitSelect">
        <option value="metric">°C</option>
        <option value="imperial">°F</option>
      </select>
      <button id="searchBtn">🔍</button>
    </div>

    <p id="error"></p>
    <div id="loader">⏳ Loading...</div>

    <div class="weather-info">
      <img id="weatherIcon" class="icon">
      <h2 id="temp">--</h2>
      <h3 id="desc">--</h3>
      <hr>
      <p id="location">--</p>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">
    <h2>📊 Today's Highlights</h2>

    <div class="highlights">
      <div class="card"><h3>💧 Humidity</h3><p id="humidity">--%</p></div>
      <div class="card"><h3>🌬 Wind</h3><p id="wind">--</p></div>
      <div class="card"><h3>🌅 Sunrise</h3><p id="sunrise">--</p></div>
      <div class="card"><h3>🌇 Sunset</h3><p id="sunset">--</p></div>
      <div class="card"><h3>☁ Clouds</h3><p id="clouds">--%</p></div>
      <div class="card"><h3>📈 Pressure</h3><p id="pressure">--</p></div>
    </div>

    <h2>📅 5-Day Forecast</h2>
    <div id="forecast" class="forecast"></div>

    <h2>📈 Temperature Trend</h2>
    <canvas id="weatherChart"></canvas>

    <h2>⭐ Tomorrow</h2>
    <div id="tomorrow" class="card"></div>
  </div>

</div>
<p class="footer">Made by D² 💙</p>

</body>
</html>
